spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.88.129:8848 # Nacos服务地址
        enabled: true
        service: gateway
        username: nacos
        password: nacos
      config:
        server-addr: 192.168.88.129:8848 # Nacos作为配置中心地址
        username: nacos
        password: nacos
        file-extension: yaml
        shared-configs:
          - dataId: mybatis.yaml
          - dataId: mysql.yaml
          - dataId: mail.yaml
          - dataId: threadPool.yaml
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**,/follow/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/medical/**,/coupon/**,/test/**
        - id: disease-service
          uri: lb://disease-service
          predicates:
            - Path=/disease/**,/symptom/**,/test/**
        - id: remark-service
          uri: lb://remark-service
          predicates:
            - Path=/remark/**,/test/**,/article/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/order/**
